[project]
name = "ics-attack-dataset-lab"
version = "0.1.0"
description = "Reproducible ICS/OT labelled dataset generation lab"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
icslab = "ics_dataset_lab.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ics_dataset_lab"]

[tool.ruff]
line-length = 100
